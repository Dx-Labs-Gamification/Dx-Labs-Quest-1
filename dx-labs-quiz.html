<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dx Labs — Workshop Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest-dark:#122019;
    --forest:#1D3A29;
    --forest-mid:#2E5940;
    --moss:#6E9678;
    --moss-light:#A9C4AE;
    --cream:#F3EFE0;
    --cream-dim:#E6E0CB;
    --pink:#C97B84;
    --pink-dark:#A85862;
    --ink:#142218;
    --red:#B4453A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'VT323', monospace;
    background: var(--forest-dark);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(169,196,174,0.10), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(201,123,132,0.08), transparent 42%);
    color: var(--cream);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 36px 16px;
  }
  .stage{ width:100%; max-width: 600px; }

  /* pixel-cut corner, works on any box */
  .pixel-corner{
    clip-path: polygon(
      12px 0%, calc(100% - 12px) 0%,
      calc(100% - 12px) 6px, calc(100% - 6px) 6px, calc(100% - 6px) 12px, 100% 12px,
      100% calc(100% - 12px), calc(100% - 6px) calc(100% - 12px), calc(100% - 6px) calc(100% - 6px), calc(100% - 12px) calc(100% - 6px), calc(100% - 12px) 100%,
      12px 100%, 12px calc(100% - 6px), 6px calc(100% - 6px), 6px calc(100% - 12px), 0% calc(100% - 12px),
      0% 12px, 6px 12px, 6px 6px, 12px 6px
    );
  }
  .pixel-corner-sm{
    clip-path: polygon(
      6px 0%, calc(100% - 6px) 0%,
      calc(100% - 6px) 3px, calc(100% - 3px) 3px, calc(100% - 3px) 6px, 100% 6px,
      100% calc(100% - 6px), calc(100% - 3px) calc(100% - 6px), calc(100% - 3px) calc(100% - 3px), calc(100% - 6px) calc(100% - 3px), calc(100% - 6px) 100%,
      6px 100%, 6px calc(100% - 3px), 3px calc(100% - 3px), 3px calc(100% - 6px), 0% calc(100% - 6px),
      0% 6px, 3px 6px, 3px 3px, 6px 3px
    );
  }

  /* Masthead */
  .masthead{ text-align:center; margin-bottom:24px; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color: var(--moss-light);
    margin-bottom:14px;
  }
  .title{
    font-family:'Press Start 2P', monospace;
    font-size: 34px;
    line-height:1.4;
    color: var(--cream);
    text-shadow: 3px 3px 0 var(--forest-mid);
  }
  .subtitle{
    font-family:'VT323', monospace;
    font-size:19px;
    color: var(--moss-light);
    margin-top:14px;
    letter-spacing:0.02em;
  }
  .description{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    line-height:1.7;
    color: rgba(243,239,224,0.55);
    max-width:440px;
    margin: 14px auto 0;
  }

  /* Card = frame within frame, pixel-cut */
  .card-frame{
    background: var(--forest-mid);
    padding: 9px;
  }
  .card{
    background: var(--cream);
    color: var(--ink);
    padding: 34px 32px;
    position:relative;
  }
  .stamp{
    position:absolute;
    top:18px; right:18px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color: var(--forest-mid);
    border:2px solid var(--forest-mid);
    padding:4px 8px;
    transform: rotate(2deg);
  }

  label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color: var(--forest-mid);
    margin-bottom:8px;
    margin-top:20px;
  }
  label:first-of-type{ margin-top:0; }
  input[type=text], textarea{
    width:100%;
    font-family:'VT323', monospace;
    font-size:22px;
    padding:11px 12px;
    border:2px solid var(--forest-mid);
    background: #fff;
    color: var(--ink);
  }
  input:focus, textarea:focus{
    outline:2px solid var(--pink-dark);
    outline-offset:1px;
  }
  textarea{ resize:vertical; min-height:80px; }

  .btn{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    font-weight:700;
    padding:13px 20px;
    border:none;
    cursor:pointer;
    background: var(--forest);
    color: var(--cream);
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .btn:hover{ background: var(--forest-dark); }
  .btn:active{ transform: scale(0.98); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-block{ width:100%; margin-top:22px; }
  .btn-ghost{
    background: transparent;
    border:2px solid var(--forest-mid);
    color: var(--forest-mid);
  }
  .btn-ghost:hover{ background: rgba(46,89,64,0.08); }

  .error-msg{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color: var(--red);
    margin-top:14px;
    line-height:1.6;
  }
  .hint{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color: rgba(20,34,24,0.55);
    margin-top:14px;
    line-height:1.6;
  }

  /* Progress dots */
  .progress{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:22px;
  }
  .dot{
    width:28px; height:28px;
    border:2px solid var(--moss);
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color: var(--moss-light);
    background: transparent;
  }
  .dot.done{ background: var(--moss); color: var(--forest-dark); border-color: var(--moss); }
  .dot.active{ background: var(--pink); color: var(--forest-dark); border-color: var(--pink); }

  .q-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: rgba(20,34,24,0.5);
  }
  .q-text{
    font-family:'VT323', monospace;
    font-size:30px;
    line-height:1.2;
    margin-top:8px;
    margin-bottom:20px;
    color: var(--forest-dark);
  }
  .option{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    border:2px solid rgba(20,34,24,0.2);
    margin-bottom:9px;
    cursor:pointer;
    font-family:'VT323', monospace;
    font-size:21px;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .option:hover{ border-color: var(--moss); background: rgba(110,150,120,0.08); }
  .option.selected{ border-color: var(--forest-mid); background: rgba(46,89,64,0.12); }
  .option .letter{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    width:24px; height:24px;
    border:2px solid rgba(20,34,24,0.35);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    background:#fff;
  }
  .option.selected .letter{ background: var(--forest-mid); border-color: var(--forest-mid); color:#fff; }

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:24px;
  }
  .nav-row .btn{ min-width:110px; }
  .spacer{ flex:1; }

  /* Results */
  .score-big{
    font-family:'Press Start 2P', monospace;
    font-size:44px;
    text-align:center;
    color: var(--forest-mid);
    margin: 10px 0 6px;
  }
  .score-label{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color: rgba(20,34,24,0.5);
  }
  .breakdown{ margin-top:26px; }
  .b-row{
    display:flex;
    gap:10px;
    align-items:flex-start;
    padding:11px 0;
    border-top:2px solid rgba(20,34,24,0.12);
    font-family:'VT323', monospace;
    font-size:18px;
  }
  .b-row:last-child{ border-bottom:2px solid rgba(20,34,24,0.12); }
  .b-mark{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    flex-shrink:0;
    width:18px;
  }
  .b-mark.ok{ color: var(--forest-mid); }
  .b-mark.no{ color: var(--red); }

  .footnote{
    text-align:center;
    margin-top:20px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color: rgba(243,239,224,0.4);
  }
  .footnote button{
    background:none; border:none; color: rgba(243,239,224,0.4);
    text-decoration:underline; cursor:pointer; font-family:inherit; font-size:inherit;
  }

  /* Admin */
  .admin-table{ width:100%; border-collapse:collapse; margin-top:14px; font-family:'VT323', monospace; font-size:18px; }
  .admin-table th, .admin-table td{
    text-align:left; padding:8px 6px; border-bottom:2px solid rgba(20,34,24,0.15);
  }
  .admin-table th{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.08em;
    text-transform:uppercase; color: rgba(20,34,24,0.5);
  }
  .tag{
    font-family:'JetBrains Mono', monospace; font-size:10px;
    padding:3px 7px; background: rgba(46,89,64,0.15); color: var(--forest-mid);
  }
  .loading{ text-align:center; padding:40px 0; font-family:'JetBrains Mono', monospace; font-size:13px; color: rgba(20,34,24,0.5); }
</style>
</head>
<body>
<div class="stage">
  <div class="masthead">
    <div class="title">Dx Labs</div>
    <div class="subtitle">Register with your name to begin.</div>
    <div class="description">A hands-on workshop on leveling up project management and facilities management through open source tools. Check in below, then work through five quick questions to warm up before we dive in.</div>
  </div>
  <div id="app"></div>
  <div class="footnote" id="footnote"></div>
</div>

<script>
const QUESTIONS = [
  {
    id:'q1', type:'mcq',
    text:'AI models can be biased if trained on biased data.',
    options:['True','False'],
    correct:0
  },
  {
    id:'q2', type:'mcq',
    text:'This workshop will mainly use which language for hands-on sessions?',
    options:['Java','Python','R','C++'],
    correct:1
  },
  {
    id:'q3', type:'mcq',
    text:'A chatbot always understands meaning the way a human does.',
    options:['True','False'],
    correct:1
  },
  {
    id:'q4', type:'mcq',
    text:'What does "EDA" stand for in data work?',
    options:['Exploratory Data Analysis','Extended Data Access','Electronic Data Archive','External Data Audit'],
    correct:0
  },
  {
    id:'q5', type:'short',
    text:"Name one topic you're most excited to learn in this workshop."
  }
];
const TOTAL_MCQ = QUESTIONS.filter(q=>q.type==='mcq').length;
const ADMIN_CODE = 'dxlabs2025';
const LETTERS = ['A','B','C','D'];

let state = {
  screen: 'loading',
  participant: null, // {name, key}
  qIndex: 0,
  answers: {},
  existingResult: null,
  allowedList: [], // array of names
  error: ''
};

function normKey(s){ return (s||'').trim().toLowerCase(); }

async function loadAllowedList(){
  try{
    const res = await window.storage.get('allowed-participants', true);
    return res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ return []; }
}
async function saveAllowedList(list){
  await window.storage.set('allowed-participants', JSON.stringify(list), true);
}
async function getResult(key){
  try{
    const res = await window.storage.get('result:'+key, true);
    return res && res.value ? JSON.parse(res.value) : null;
  }catch(e){ return null; }
}
async function saveResult(key, data){
  await window.storage.set('result:'+key, JSON.stringify(data), true);
}
async function listAllResults(){
  try{
    const idx = await window.storage.get('result-index', true);
    const keys = idx && idx.value ? JSON.parse(idx.value) : [];
    const out = [];
    for(const k of keys){
      const r = await getResult(k);
      if(r) out.push(r);
    }
    return out.sort((a,b)=> b.score - a.score || a.timestamp - b.timestamp);
  }catch(e){ return []; }
}
async function addToResultIndex(key){
  try{
    const idx = await window.storage.get('result-index', true);
    const keys = idx && idx.value ? JSON.parse(idx.value) : [];
    if(!keys.includes(key)){
      keys.push(key);
      await window.storage.set('result-index', JSON.stringify(keys), true);
    }
  }catch(e){}
}

function render(){
  const app = document.getElementById('app');
  const foot = document.getElementById('footnote');
  app.innerHTML = '';
  foot.innerHTML = '';

  if(state.screen === 'loading'){
    app.innerHTML = `<div class="card-frame pixel-corner"><div class="card pixel-corner"><div class="loading">Loading…</div></div></div>`;
    return;
  }
  if(state.screen === 'register') return renderRegister(app, foot);
  if(state.screen === 'quiz') return renderQuiz(app, foot);
  if(state.screen === 'results') return renderResults(app, foot);
  if(state.screen === 'admin-login') return renderAdminLogin(app, foot);
  if(state.screen === 'admin') return renderAdmin(app, foot);
}

function renderRegister(app, foot){
  app.innerHTML = `
    <div class="card-frame pixel-corner">
      <div class="card pixel-corner">
        <div class="stamp">Registration</div>
        <label>Full name</label>
        <input type="text" id="reg-name" placeholder="Juan Dela Cruz" autocomplete="name">
        <button class="btn btn-block pixel-corner-sm" id="reg-submit">Check in</button>
        ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
        <div class="hint">Only names on the registered participant list can take the quiz. Contact your organizer if you believe this is a mistake.</div>
      </div>
    </div>
  `;
  foot.innerHTML = `<button id="admin-link">Organizer sign-in</button>`;
  document.getElementById('admin-link').onclick = ()=>{ state.screen='admin-login'; state.error=''; render(); };

  document.getElementById('reg-submit').onclick = async ()=>{
    const name = document.getElementById('reg-name').value.trim();
    if(!name){
      state.error = 'Please enter your full name.';
      return render();
    }
    const key = normKey(name);
    const allowed = state.allowedList.some(n => normKey(n) === key);
    if(!allowed){
      state.error = `"${name}" is not on the registered participant list.`;
      return render();
    }
    const existing = await getResult(key);
    if(existing){
      state.participant = {name: existing.name, key};
      state.existingResult = existing;
      state.screen = 'results';
      return render();
    }
    state.participant = {name, key};
    state.error = '';
    state.screen = 'quiz';
    state.qIndex = 0;
    state.answers = {};
    render();
  };
}

function renderQuiz(app, foot){
  const q = QUESTIONS[state.qIndex];
  const dots = QUESTIONS.map((qq,i)=>{
    let cls='dot';
    if(i < state.qIndex) cls+=' done';
    else if(i === state.qIndex) cls+=' active';
    return `<div class="${cls}">${i+1}</div>`;
  }).join('');

  let body = '';
  if(q.type === 'mcq'){
    body = q.options.map((opt,i)=>{
      const selected = state.answers[q.id] === i;
      return `<div class="option pixel-corner-sm ${selected?'selected':''}" data-i="${i}">
        <span class="letter">${LETTERS[i]}</span><span>${opt}</span>
      </div>`;
    }).join('');
  } else {
    const val = state.answers[q.id] || '';
    body = `<textarea id="short-answer" placeholder="Type your answer here…">${val}</textarea>`;
  }

  app.innerHTML = `
    <div class="progress">${dots}</div>
    <div class="card-frame pixel-corner">
      <div class="card pixel-corner">
        <div class="stamp">Q ${state.qIndex+1} / ${QUESTIONS.length}</div>
        <div class="q-eyebrow">${q.type === 'mcq' ? 'Select one' : 'Short answer'}</div>
        <div class="q-text">${q.text}</div>
        ${body}
        ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
        <div class="nav-row">
          <button class="btn btn-ghost pixel-corner-sm" id="q-back" ${state.qIndex===0?'disabled':''}>Back</button>
          <div class="spacer"></div>
          <button class="btn pixel-corner-sm" id="q-next">${state.qIndex === QUESTIONS.length-1 ? 'Submit' : 'Next'}</button>
        </div>
      </div>
    </div>
  `;
  foot.innerHTML = `Checked in as ${state.participant.name}`;

  if(q.type === 'mcq'){
    app.querySelectorAll('.option').forEach(el=>{
      el.onclick = ()=>{
        state.answers[q.id] = parseInt(el.dataset.i);
        state.error = '';
        render();
      };
    });
  }

  document.getElementById('q-back').onclick = ()=>{
    if(state.qIndex>0){ state.qIndex--; state.error=''; render(); }
  };
  document.getElementById('q-next').onclick = async ()=>{
    if(q.type === 'short'){
      state.answers[q.id] = document.getElementById('short-answer').value.trim();
    }
    if(q.type === 'mcq' && state.answers[q.id] === undefined){
      state.error = 'Pick an option before continuing.';
      return render();
    }
    state.error = '';
    if(state.qIndex === QUESTIONS.length-1){
      await submitQuiz();
      return;
    }
    state.qIndex++;
    render();
  };
}

async function submitQuiz(){
  let score = 0;
  const breakdown = QUESTIONS.filter(q=>q.type==='mcq').map(q=>{
    const chosen = state.answers[q.id];
    const isCorrect = chosen === q.correct;
    if(isCorrect) score++;
    return {
      text: q.text,
      correct: isCorrect,
      yourAnswer: chosen !== undefined ? q.options[chosen] : '(no answer)',
      correctAnswer: q.options[q.correct]
    };
  });
  const shortAnswer = state.answers['q5'] || '';

  const result = {
    name: state.participant.name,
    score,
    total: TOTAL_MCQ,
    breakdown,
    shortAnswer,
    timestamp: Date.now()
  };
  await saveResult(state.participant.key, result);
  await addToResultIndex(state.participant.key);
  state.existingResult = result;
  state.screen = 'results';
  render();
}

function renderResults(app, foot){
  const r = state.existingResult;
  app.innerHTML = `
    <div class="card-frame pixel-corner">
      <div class="card pixel-corner">
        <div class="stamp">Result</div>
        <div class="score-label">Score</div>
        <div class="score-big">${r.score}/${r.total}</div>
        <div class="score-label" style="margin-top:2px;">${escapeHtml(r.name)}</div>
        <div class="breakdown">
          ${r.breakdown.map(b=>`
            <div class="b-row">
              <div class="b-mark ${b.correct?'ok':'no'}">${b.correct?'✓':'✗'}</div>
              <div>
                <div>${b.text}</div>
                ${!b.correct ? `<div class="hint" style="margin-top:4px;">Your answer: ${b.yourAnswer} · Correct: ${b.correctAnswer}</div>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
        ${r.shortAnswer ? `<div class="hint" style="margin-top:16px;">Excited to learn: "${escapeHtml(r.shortAnswer)}"</div>` : ''}
      </div>
    </div>
  `;
  foot.innerHTML = `Results are saved — reopening this link with the same name won't let you retake the quiz.`;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

function renderAdminLogin(app, foot){
  app.innerHTML = `
    <div class="card-frame pixel-corner">
      <div class="card pixel-corner">
        <div class="stamp">Organizer</div>
        <label>Passcode</label>
        <input type="text" id="admin-pass" placeholder="Enter organizer passcode">
        <button class="btn btn-block pixel-corner-sm" id="admin-submit">Sign in</button>
        ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
      </div>
    </div>
  `;
  foot.innerHTML = `<button id="back-reg">Back to check-in</button>`;
  document.getElementById('back-reg').onclick = ()=>{ state.screen='register'; state.error=''; render(); };
  document.getElementById('admin-submit').onclick = ()=>{
    const val = document.getElementById('admin-pass').value;
    if(val === ADMIN_CODE){
      state.error='';
      state.screen='admin';
      render();
    } else {
      state.error = 'Incorrect passcode.';
      render();
    }
  };
}

async function renderAdmin(app, foot){
  app.innerHTML = `<div class="card-frame pixel-corner"><div class="card pixel-corner"><div class="loading">Loading dashboard…</div></div></div>`;
  const results = await listAllResults();
  const listText = state.allowedList.join('\n');

  const app2 = document.getElementById('app');
  app2.innerHTML = `
    <div class="card-frame pixel-corner">
      <div class="card pixel-corner">
        <div class="stamp">Dashboard</div>
        <label>Allowed participants (one full name per line)</label>
        <textarea id="allowed-text" style="min-height:110px;">${listText}</textarea>
        <button class="btn pixel-corner-sm" id="save-allowed" style="margin-top:10px;">Save list</button>
        <div class="hint" id="save-status"></div>

        <label style="margin-top:26px;">Live leaderboard (${results.length} submitted)</label>
        ${results.length === 0 ? `<div class="hint">No submissions yet.</div>` : `
          <table class="admin-table">
            <tr><th>#</th><th>Name</th><th>Score</th></tr>
            ${results.map((r,i)=>`
              <tr>
                <td>${i+1}</td>
                <td>${escapeHtml(r.name)}</td>
                <td><span class="tag">${r.score}/${r.total}</span></td>
              </tr>
            `).join('')}
          </table>
        `}
        <button class="btn btn-ghost pixel-corner-sm" id="refresh-board" style="margin-top:16px;">Refresh</button>
      </div>
    </div>
  `;
  foot.innerHTML = `<button id="admin-logout">Sign out of organizer view</button>`;
  document.getElementById('admin-logout').onclick = ()=>{ state.screen='register'; render(); };
  document.getElementById('refresh-board').onclick = ()=> render();

  document.getElementById('save-allowed').onclick = async ()=>{
    const names = document.getElementById('allowed-text').value.split('\n').map(l=>l.trim()).filter(Boolean);
    await saveAllowedList(names);
    state.allowedList = names;
    document.getElementById('save-status').innerText = `Saved ${names.length} participant(s).`;
  };
}

async function init(){
  state.allowedList = await loadAllowedList();
  state.screen = 'register';
  render();
}
init();
</script>
</body>
</html>
